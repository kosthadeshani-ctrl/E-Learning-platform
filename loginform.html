<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: url('p/123.jpg') no-repeat center center fixed;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-header {
            margin-bottom: 20px;
        }

        .login-header h2 {
            font-size: 2rem;
            color: #f60;
        }

        .login-header p {
            font-size: 1rem;
            color: #757575;
        }

        .login-form {
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input,
        form select {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .form-group input:focus,
        form select:focus {
            border-color: #f60;
            background: #ffffff;
            outline: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        form select {
            margin-bottom: 20px;
            color: #333;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            color: white;
            background: #f60;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #f60;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

        .login-footer {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #757575;
        }

        .login-footer a {
            color: #f60;
            text-decoration: none;
            font-weight: bold;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome</h2>
            <p>Log in as an Admin or Student to access your portal</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="userType">Login As:</label>
                <select id="userType" name="userType" required>
                    <option value="admin">Admin</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
        <div class="login-footer">
            <p>Forgot your password? <a href="#">Reset here</a></p>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();

            const userType = document.getElementById("userType").value;
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (userType === "admin" && username === "admin" && password === "adminpass") {
                alert("Welcome Admin!");
                window.location.href = "home.html";
            } else if (userType === "student" && username === "student" && password === "studentpass") {
                alert("Welcome Student!");
                window.location.href = "home.html";
            } else {
                alert("Invalid username or password. Please try again.");
            }
        });
    </script>
</body>
</html>
